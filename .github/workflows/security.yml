name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL C/C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: c-cpp
      - name: Install full build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev python3
      - name: Build and test the full core plus network host
        run: make clean && make validate && make test-net
      - uses: github/codeql-action/analyze@v4.37.4
  hardening:
    name: Hardened compile gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Security flags
        run: make security
